<svg width="1100" height="260" viewBox="0 0 1100 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Profile Metrics Banner</title>
  <desc id="desc">A colorful GitHub profile banner about AI automation, backend engineering, and practical tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.42" stop-color="#172554"/>
      <stop offset="0.72" stop-color="#3B0764"/>
      <stop offset="1" stop-color="#701A75"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="220" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="220" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="220" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BEF264"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="220" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1100" height="260" rx="26" fill="url(#bg)"/>
  <rect width="1100" height="260" rx="26" fill="url(#grid)"/>
  <circle cx="960" cy="34" r="120" fill="#22D3EE" opacity="0.16"/>
  <circle cx="102" cy="228" r="150" fill="#FB7185" opacity="0.14"/>
  <path d="M703 23C792 52 852 67 971 57" stroke="#FDE68A" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
  <path d="M55 80C134 38 210 39 289 77" stroke="#2DD4BF" stroke-width="8" stroke-linecap="round" opacity="0.45"/>

  <g filter="url(#soft-shadow)">
    <rect x="54" y="42" width="992" height="176" rx="22" fill="#0B1224" fill-opacity="0.76" stroke="#FFFFFF" stroke-opacity="0.12"/>
  </g>

  <text x="90" y="91" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="800">GitHub Activity Snapshot</text>
  <text x="90" y="124" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500">Code, automation, knowledge workflow, and practical AI tools</text>

  <g transform="translate(90 150)">
    <rect width="205" height="54" rx="16" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.55"/>
    <circle cx="30" cy="27" r="11" fill="url(#cyan)"/>
    <text x="54" y="24" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Backend</text>
    <text x="54" y="42" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Java / Spring</text>
  </g>

  <g transform="translate(325 150)">
    <rect width="205" height="54" rx="16" fill="#0F172A" stroke="#F0ABFC" stroke-opacity="0.55"/>
    <circle cx="30" cy="27" r="11" fill="url(#pink)"/>
    <text x="54" y="24" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Automation</text>
    <text x="54" y="42" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Python / Scripts</text>
  </g>

  <g transform="translate(560 150)">
    <rect width="205" height="54" rx="16" fill="#0F172A" stroke="#BEF264" stroke-opacity="0.55"/>
    <circle cx="30" cy="27" r="11" fill="url(#lime)"/>
    <text x="54" y="24" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">AI Workflow</text>
    <text x="54" y="42" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Agent / Skill</text>
  </g>

  <g transform="translate(795 150)">
    <rect width="205" height="54" rx="16" fill="#0F172A" stroke="#FDE68A" stroke-opacity="0.55"/>
    <circle cx="30" cy="27" r="11" fill="url(#amber)"/>
    <text x="54" y="24" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800">Useful Tools</text>
    <text x="54" y="42" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Small but real</text>
  </g>

  <text x="815" y="94" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="900" opacity="0.96">AI x Code</text>
  <text x="823" y="121" fill="#A5F3FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2">REAL WORK</text>
</svg>
