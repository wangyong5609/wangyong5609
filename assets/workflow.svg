<svg width="1100" height="420" viewBox="0 0 1100 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Diagram</title>
  <desc id="desc">A colorful static workflow diagram from real problems to reusable scripts, skills, and templates.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1100" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.45" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="190" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="190" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="190" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#84CC16"/>
    </linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="190" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="card5" x1="0" y1="0" x2="190" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="card6" x1="0" y1="0" x2="190" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="card7" x1="0" y1="0" x2="190" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-20%" width="136%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#64748B" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1100" height="420" rx="30" fill="url(#page)"/>
  <rect width="1100" height="420" rx="30" fill="url(#dots)"/>
  <circle cx="1020" cy="70" r="118" fill="#A855F7" opacity="0.12"/>
  <circle cx="110" cy="360" r="130" fill="#22D3EE" opacity="0.14"/>

  <text x="70" y="66" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="900">我的工作方式</text>
  <text x="70" y="98" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">从真实问题出发，快速做出可验证的小工具，再沉淀成可复用的方法。</text>

  <rect x="254" y="163" width="72" height="4" rx="2" fill="#334155"/>
  <polygon points="336,165 322,157 322,173" fill="#334155"/>
  <rect x="524" y="163" width="72" height="4" rx="2" fill="#334155"/>
  <polygon points="606,165 592,157 592,173" fill="#334155"/>
  <rect x="794" y="143" width="28" height="4" rx="2" fill="#7C3AED" transform="rotate(-29 794 143)"/>
  <polygon points="824,136 807,136 815,151" fill="#7C3AED"/>
  <rect x="928" y="176" width="4" height="55" rx="2" fill="#334155"/>
  <polygon points="930,241 922,227 938,227" fill="#334155"/>
  <rect x="727" y="285" width="109" height="4" rx="2" fill="#334155"/>
  <polygon points="717,287 731,279 731,295" fill="#334155"/>
  <rect x="456" y="285" width="76" height="4" rx="2" fill="#334155"/>
  <polygon points="446,287 460,279 460,295" fill="#334155"/>
  <rect x="218" y="285" width="37" height="4" rx="2" fill="#7C3AED"/>
  <rect x="206" y="222" width="4" height="55" rx="2" fill="#7C3AED"/>
  <polygon points="208,212 200,226 216,226" fill="#7C3AED"/>

  <g>
    <g transform="translate(70 119)">
      <rect width="184" height="92" rx="22" fill="#2563EB"/>
      <text x="28" y="39" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">真实问题</text>
      <text x="28" y="65" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Real Problem</text>
    </g>
    <g transform="translate(340 119)">
      <rect width="184" height="92" rx="22" fill="#A855F7"/>
      <text x="28" y="39" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">拆解流程</text>
      <text x="28" y="65" fill="#FCE7F3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Decompose</text>
    </g>
    <g transform="translate(610 119)">
      <rect width="184" height="92" rx="22" fill="#10B981"/>
      <text x="28" y="39" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">找自动化点</text>
      <text x="28" y="65" fill="#ECFCCB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Automation Spot</text>
    </g>
    <g transform="translate(836 241)">
      <rect width="194" height="92" rx="22" fill="#F97316"/>
      <text x="28" y="39" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">快速小工具</text>
      <text x="28" y="65" fill="#FEF3C7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Quick Tool</text>
    </g>
    <g transform="translate(532 241)">
      <rect width="184" height="92" rx="22" fill="#0EA5E9"/>
      <text x="28" y="39" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">真实数据验证</text>
      <text x="28" y="65" fill="#DBEAFE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Real Data</text>
    </g>
    <g transform="translate(255 241)">
      <rect width="190" height="92" rx="22" fill="#E11D48"/>
      <text x="28" y="39" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">边界和异常</text>
      <text x="28" y="65" fill="#FAE8FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Edge Cases</text>
    </g>
  </g>

  <g transform="translate(825 94)">
    <rect width="210" height="82" rx="22" fill="#14B8A6"/>
    <text x="28" y="35" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="900">沉淀复用</text>
    <text x="28" y="60" fill="#DCFCE7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800">Script / Skill / Template</text>
  </g>

  <text x="70" y="374" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">Real problem -> Small tool -> Data validation -> Reusable workflow</text>
</svg>
